services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: depintel
      POSTGRES_PASSWORD: depintel
      POSTGRES_DB: depintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depintel"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
